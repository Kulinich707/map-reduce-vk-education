name: vk-zk-homework
services:
  zk1:
    environment:
      JVMFLAGS: -Xms64m -Xmx256m
    hostname: zk1
    healthcheck:
      test:
        - CMD-SHELL
        - echo ruok | nc -w 2 127.0.0.1 2181 | grep imok
      timeout: 3s
      interval: 3s
      retries: 20
    image: zookeeper:3.9.6
    networks:
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 2181
        published: "22181"
        protocol: tcp
    user: 1000:1000
    volumes:
      - type: bind
        source: /Users/gpr/Documents/Codex/2026-11-05/new-chat/outputs/ZooKeeper_HW/infra/zk1/zoo.cfg
        target: /conf/zoo.cfg
        read_only: true
        bind: {}
      - type: bind
        source: /Users/gpr/Documents/Codex/2026-11-05/new-chat/outputs/ZooKeeper_HW/infra/zk1/myid
        target: /data/myid
        read_only: true
        bind: {}
      - type: volume
        source: zk1-data
        target: /data/version-2
        volume: {}
      - type: volume
        source: zk1-log
        target: /datalog
        volume: {}
  zk2:
    environment:
      JVMFLAGS: -Xms64m -Xmx256m
    hostname: zk2
    healthcheck:
      test:
        - CMD-SHELL
        - echo ruok | nc -w 2 127.0.0.1 2181 | grep imok
      timeout: 3s
      interval: 3s
      retries: 20
    image: zookeeper:3.9.6
    networks:
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 2181
        published: "22182"
        protocol: tcp
    user: 1000:1000
    volumes:
      - type: bind
        source: /Users/gpr/Documents/Codex/2026-11-05/new-chat/outputs/ZooKeeper_HW/infra/zk2/zoo.cfg
        target: /conf/zoo.cfg
        read_only: true
        bind: {}
      - type: bind
        source: /Users/gpr/Documents/Codex/2026-11-05/new-chat/outputs/ZooKeeper_HW/infra/zk2/myid
        target: /data/myid
        read_only: true
        bind: {}
      - type: volume
        source: zk2-data
        target: /data/version-2
        volume: {}
      - type: volume
        source: zk2-log
        target: /datalog
        volume: {}
  zk3:
    environment:
      JVMFLAGS: -Xms64m -Xmx256m
    hostname: zk3
    healthcheck:
      test:
        - CMD-SHELL
        - echo ruok | nc -w 2 127.0.0.1 2181 | grep imok
      timeout: 3s
      interval: 3s
      retries: 20
    image: zookeeper:3.9.6
    networks:
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 2181
        published: "22183"
        protocol: tcp
    user: 1000:1000
    volumes:
      - type: bind
        source: /Users/gpr/Documents/Codex/2026-11-05/new-chat/outputs/ZooKeeper_HW/infra/zk3/zoo.cfg
        target: /conf/zoo.cfg
        read_only: true
        bind: {}
      - type: bind
        source: /Users/gpr/Documents/Codex/2026-11-05/new-chat/outputs/ZooKeeper_HW/infra/zk3/myid
        target: /data/myid
        read_only: true
        bind: {}
      - type: volume
