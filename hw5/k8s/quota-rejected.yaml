{
  "apiVersion": "v1",
  "kind": "Pod",
  "metadata": {
    "name": "quota-rejected",
    "namespace": "hw4-quota"
  },
  "spec": {
    "restartPolicy": "Never",
    "terminationGracePeriodSeconds": 0,
    "containers": [
      {
        "name": "sleep",
        "image": "hw4-skills:1.0",
        "imagePullPolicy": "Never",
        "command": [
          "python",
          "-c",
          "import time; time.sleep(600)"
        ],
        "resources": {
          "requests": {
            "cpu": "150m",
            "memory": "64Mi"
          },
          "limits": {
            "cpu": "150m",
            "memory": "64Mi"
          }
        }
      }
    ]
  }
}