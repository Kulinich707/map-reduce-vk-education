{
  "apiVersion": "batch/v1",
  "kind": "Job",
  "metadata": {
    "name": "tuned",
    "namespace": "hw4"
  },
  "spec": {
    "backoffLimit": 0,
    "activeDeadlineSeconds": 300,
    "template": {
      "spec": {
        "restartPolicy": "Never",
        "containers": [
          {
            "name": "worker",
            "image": "hw4-skills:1.0",
            "imagePullPolicy": "Never",
            "args": [
              "single",
              "--run",
              "tuned"
            ],
            "resources": {
              "requests": {
                "cpu": "250m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "1000m",
                "memory": "160Mi"
              }
            },
            "env": [
              {
                "name": "S3_ENDPOINT",
                "value": "http://rustfs:9000"
              },
              {
                "name": "S3_ACCESS_KEY",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "s3-auth",
                    "key": "access"
                  }
                }
              },
              {
                "name": "S3_SECRET_KEY",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "s3-auth",
                    "key": "secret"
                  }
                }
              }
            ]
          }
        ]
      }
    }
  }
}
