services:
  rustfs:
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-labadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in environment}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_STORAGE_CLASS_STANDARD: 'EC:4'
      RUSTFS_ERASURE_SET_DRIVE_COUNT: '8'
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: 'true'
    command: ['/data{1...8}']
    volumes:
      - disk1:/data1
      - disk2:/data2
      - disk3:/data3
      - disk4:/data4
      - disk5:/data5
      - disk6:/data6
      - disk7:/data7
      - disk8:/data8
volumes:
  disk1:
  disk2:
  disk3:
  disk4:
  disk5:
  disk6:
  disk7:
  disk8:
